// Versions follow the Godot 4.7.2 Android build template (godot/android/build/config.gradle) so the AAR
// links cleanly into the Gradle export: AGP 8.6.1, Kotlin 2.1.21, Java 17, compileSdk 36, minSdk 24.
plugins {
    id 'com.android.library' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

ext {
    // Must match the editor / export templates (godot --version).
    godotVersion = '4.7.2.stable'
    // Latest stable on Google Maven (checked 2026-10-26). Keep in sync with the *_DEPENDENCY constants in
    // godot/addons/admob/export_plugin.gd: that is what the app build actually links.
    playServicesAdsVersion = '25.5.0'
    umpVersion = '4.0.0'
}

android {
    namespace 'com.flipfold.ludozing.admob'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // play-services-ads 25.x ships Kotlin 2.3 module metadata (internal proto helpers) that Kotlin 2.1.21, the
        // Godot template's version, refuses to read. We only call its Java API, so skip the version check.
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    // Release and debug AARs carry the same code; the Godot export picks the one matching the export mode.
    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "AdMob-${variant.name}.aar"
        }
    }
}

dependencies {
    // Provided by the Godot app at runtime (godot-lib in the export template): compile against it only.
    compileOnly "org.godotengine:godot:$godotVersion"
    // Not bundled into the AAR: the export plugin adds both to the app build as Maven dependencies.
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.ump:user-messaging-platform:$umpVersion"
}
